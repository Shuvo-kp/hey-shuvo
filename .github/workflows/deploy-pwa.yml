name: Deploy Web PWA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: check_pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled in Settings -> Pages yet; skipping web deploy so branch status remains clean."
          fi
      - if: steps.check_pages.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.check_pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        if: steps.check_pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
